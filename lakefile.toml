name = "DirichletProblem"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DirichletProblem"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
warn.sorry = false


[[require]]
name = "verso"
scope = "leanprover"
rev = "v4.34.0-rc2"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "d9f6d1887c233aeabd725c175bd2ceca6215452a"

[[lean_lib]]
name = "DirichletProblem"

[[lean_exe]]
name = "generate-docs"
root = "Manual"
